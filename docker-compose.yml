services:
  api:
    build: .
    ports:
      - "8799:8799"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8799
      - MEMORY_DB_PATH=/data/memory.sqlite
      - BROWSER_DATA_DIR=/data/browser
      - AUDIT_LOG_PATH=/data/audit.log
      - BROWSER_HEADLESS=true
    volumes:
      - ogb-data:/data
    restart: unless-stopped

volumes:
  ogb-data:
